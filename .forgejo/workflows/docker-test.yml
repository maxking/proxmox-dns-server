name: Docker Build Test

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master

jobs:
  docker-build:
    runs-on: docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t proxmox-dns-server:test .

      - name: Test container starts
        run: |
          # Run container with --help to verify it starts correctly
          docker run --rm proxmox-dns-server:test --help || true
          echo "Container built and executed successfully"

      - name: Check image size
        run: |
          docker images proxmox-dns-server:test --format "Image size: {{.Size}}"
